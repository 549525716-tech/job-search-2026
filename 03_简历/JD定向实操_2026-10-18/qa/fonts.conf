<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font7</dir>
  <cachedir>/tmp/career-resume-font-cache</cachedir>
  <alias><family>PingFang SC</family><prefer><family>Hiragino Sans GB</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Hiragino Sans GB</family><family>Arial</family></prefer></alias>
</fontconfig>
